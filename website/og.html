<!doctype html>
<!-- Source for img/og.png (1200x630). Render it from website/dist after a build:
     copy this file into dist, open it at a 1200x630 viewport and screenshot. -->
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
  html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:#000;color:#fff}
  body{position:relative;font-family:'Geist Mono',ui-monospace,monospace}
  .glow{position:absolute;right:-120px;top:-60px;width:820px;height:820px;border-radius:50%;
    background:radial-gradient(circle,rgba(255,92,219,.28) 0%,rgba(61,242,255,.12) 38%,transparent 66%)}
  .dots{position:absolute;inset:0}
  .copy{position:absolute;left:72px;top:60px;width:600px}
  .brand{display:flex;align-items:center;gap:16px;font-weight:700;font-size:34px}
  .brand img{width:58px;height:58px;border-radius:14px}
  h1{margin:64px 0 0;font-size:80px;line-height:.98;letter-spacing:-.045em;font-weight:700}
  h1 span{display:block;color:transparent;-webkit-text-stroke:2px #fff}
  p{margin:26px 0 0;font-family:'Atkinson Hyperlegible',system-ui,sans-serif;font-size:28px;line-height:1.35;color:#CFCFCF}
  .tag{position:absolute;left:72px;bottom:52px;display:flex;gap:14px}
  .tag b{font-size:21px;background:#C6FF3D;color:#000;border-radius:999px;padding:12px 24px}
  .tag i{font-style:normal;font-size:21px;color:#CFCFCF;border:1.5px solid #333;border-radius:999px;padding:12px 22px}
  .phone{position:absolute;width:250px;border-radius:36px;padding:9px;background:#161616;
    box-shadow:0 0 0 1.5px #2c2c2c,0 30px 80px rgba(0,0,0,.9)}
  .phone img{display:block;width:100%;aspect-ratio:540/1130;object-fit:cover;object-position:top;border-radius:28px}
  .p1{right:215px;top:64px;transform:rotate(-6deg);box-shadow:0 0 0 1.5px #2c2c2c,0 30px 80px rgba(0,0,0,.9),0 0 90px rgba(232,34,43,.3)}
  .p2{right:-20px;top:130px;transform:rotate(7deg);opacity:.92}
  .chip{position:absolute;right:150px;top:410px;display:flex;align-items:center;gap:12px;font-weight:700;font-size:22px;
    background:#0A0A0A;border:1.5px solid #2a2a2a;border-radius:16px;padding:14px 20px;box-shadow:0 14px 34px rgba(0,0,0,.7)}
  .chip i{width:14px;height:14px;border-radius:50%;background:#E8222B;box-shadow:0 0 0 5px rgba(232,34,43,.25)}
</style>
</head>
<body>
  <div class="glow"></div>
  <svg class="dots" viewBox="0 0 1200 630" aria-hidden="true">
    <g stroke="rgba(61,242,255,.22)" stroke-width="1.2">
      <line x1="760" y1="40" x2="880" y2="110"/><line x1="880" y1="110" x2="1010" y2="60"/>
      <line x1="700" y1="560" x2="820" y2="600"/><line x1="1080" y1="560" x2="1160" y2="480"/>
    </g>
    <g fill="#3DF2FF"><circle cx="760" cy="40" r="3"/><circle cx="880" cy="110" r="3"/><circle cx="1010" cy="60" r="3"/>
      <circle cx="700" cy="560" r="3"/><circle cx="820" cy="600" r="3"/><circle cx="1080" cy="560" r="3"/><circle cx="1160" cy="480" r="3"/></g>
    <circle cx="880" cy="110" r="5" fill="#FF5CDB"/>
  </svg>
  <div class="copy">
    <div class="brand"><img src="poi.svg" alt="">MoshGrid</div>
    <h1>Find your friends<span>in the crowd.</span></h1>
    <p>Works when the network dies.</p>
  </div>
  <div class="tag"><b>Free for Android</b><i>No account</i><i>Open source</i></div>
  <div class="phone p2"><img src="img/help_sent.webp" alt=""></div>
  <div class="phone p1"><img src="img/help_incoming.webp" alt=""></div>
  <div class="chip"><i></i>Ben asked for help</div>
</body>
</html>
